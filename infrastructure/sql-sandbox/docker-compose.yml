services:
  sql-sandbox:
    image: mysql:8.0.41
    container_name: tcp-sql-sandbox
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Required by the official MySQL entrypoint to initialize the volume and drop to mysql.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: ${SQL_SANDBOX_PIDS_LIMIT:-512}
    mem_limit: ${SQL_SANDBOX_MEMORY_LIMIT:-1g}
    cpus: ${SQL_SANDBOX_CPU_LIMIT:-4.0}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /run/mysqld:size=64m,mode=0755
    environment:
      MYSQL_ROOT_PASSWORD: ${SQL_SANDBOX_ROOT_PASSWORD:?Set SQL_SANDBOX_ROOT_PASSWORD in infrastructure/sql-sandbox/.env}
      MYSQL_SANDBOX_ADMIN_PASSWORD: ${SQL_SANDBOX_ADMIN_PASSWORD:?Set SQL_SANDBOX_ADMIN_PASSWORD in infrastructure/sql-sandbox/.env}
      TZ: Asia/Kolkata
    command:
      - --default-authentication-plugin=caching_sha2_password
      # Lab schemas are written by students who type `STUDENT` for a table seeded as `students`.
      # Case-folding identifiers turns that from a dead end into a working query. This can only be
      # set when the data directory is initialized, so changing it requires `down -v`.
      - --lower-case-table-names=1
      # Application experiments let students design their own schema. MySQL 8 does not require a
      # primary key by default; pinning it means an upstream default change cannot start rejecting
      # a student's CREATE TABLE.
      - --sql-require-primary-key=0
    ports:
      # Loopback-only publication is for a backend running directly on the Linux host.
      # A backend container should use sql-sandbox:3306 instead.
      - target: 3306
        published: "${SQL_SANDBOX_PUBLISHED_PORT:-3307}"
        host_ip: 127.0.0.1
        protocol: tcp
        # This server uses ordinary Docker Compose, not Docker Swarm.
        mode: host
    volumes:
      - tcp_sql_sandbox_data:/var/lib/mysql
      - ./mysql.cnf:/etc/mysql/conf.d/99-tcp-sandbox.cnf:ro
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - tcp-sql-private

volumes:
  tcp_sql_sandbox_data:

networks:
  tcp-sql-private:
    name: tcp-sql-private
    # The backend currently runs on the Linux host under PM2. A Docker-internal
    # network prevents Docker from publishing the loopback host port.
    # Public exposure is still prevented by host_ip: 127.0.0.1 above.
    internal: false
