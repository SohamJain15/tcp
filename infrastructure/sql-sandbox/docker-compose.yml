services:
  sql-sandbox:
    image: mysql:8.0.41
    container_name: tcp-sql-sandbox
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SQL_SANDBOX_ROOT_PASSWORD:?Set SQL_SANDBOX_ROOT_PASSWORD in infrastructure/sql-sandbox/.env}
      MYSQL_SANDBOX_ADMIN_PASSWORD: ${SQL_SANDBOX_ADMIN_PASSWORD:?Set SQL_SANDBOX_ADMIN_PASSWORD in infrastructure/sql-sandbox/.env}
      TZ: Asia/Kolkata
    command:
      - --default-authentication-plugin=caching_sha2_password
    ports:
      # Loopback-only publication is for a backend running directly on the Linux host.
      # A backend container should use sql-sandbox:3306 instead.
      - "127.0.0.1:${SQL_SANDBOX_PUBLISHED_PORT:-3307}:3306"
    volumes:
      - tcp_sql_sandbox_data:/var/lib/mysql
      - ./mysql.cnf:/etc/mysql/conf.d/99-tcp-sandbox.cnf:ro
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - tcp-sql-private

volumes:
  tcp_sql_sandbox_data:

networks:
  tcp-sql-private:
    name: tcp-sql-private
